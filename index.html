<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Kraina Avalon</title>
<style>
:root{--tlo:#fbfaf7;--tekst:#1f2328;--cichy:#5b6470;--linia:#d9d6cf;--akcent:#2f5d50;--karta:#ffffff}
@media (prefers-color-scheme:dark){:root{--tlo:#15181c;--tekst:#e6e3dc;--cichy:#a0a7b0;--linia:#30363d;--akcent:#8fc7b3;--karta:#1c2026}}
*{box-sizing:border-box}
body{margin:0;background:var(--tlo);color:var(--tekst);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:46rem;margin:0 auto;padding:2.5rem 1rem 4rem}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .25rem}
h2{font-size:1.2rem;margin:2.2rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--linia)}
p,li{margin:.6rem 0}
a{color:var(--akcent)}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--karta)}
th,td{border:1px solid var(--linia);padding:.5rem .6rem;text-align:left;vertical-align:top}
th{font-weight:600}
@media (max-width:640px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border:1px solid var(--linia);margin:.75rem 0}
  td{border:0;border-bottom:1px solid var(--linia)}
  td:last-child{border-bottom:0}
  td::before{content:attr(data-etykieta);display:block;font-size:.78rem;color:var(--cichy)}
}
footer{margin-top:3rem;color:var(--cichy);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>Kraina Avalon</h1>
<p>Strona w przygotowaniu.</p>

</main>
</body>
</html>
